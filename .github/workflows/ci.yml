name: QualityPilot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-api-unit:
    name: Unit & API Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        
    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Pytest (Unit & API)
      working-directory: ./backend
      # Our pytest.ini inherently ignores tests/e2e
      run: pytest

  test-e2e:
    name: E2E UI Tests
    runs-on: ubuntu-latest
    needs: test-api-unit
    
    # We need a live PostgreSQL database for the backend during E2E tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: shop_user
          POSTGRES_PASSWORD: shop_password
          POSTGRES_DB: shopsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: "./frontend/package-lock.json"
        
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm install

    - name: Install Playwright Browsers
      working-directory: ./backend
      run: playwright install --with-deps chromium

    - name: Setup Database and Start Backend
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://shop_user:shop_password@localhost:5432/shopsphere
      run: |
        # Seed the database (creates tables if missing)
        python app/db/seed.py
        # Start FastAPI in the background
        uvicorn app.main:app --port 8000 &
        
    - name: Start Frontend
      working-directory: ./frontend
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      run: |
        # Start Next.js in the background
        npm run dev &
        
    - name: Wait for services to be ready
      run: |
        npx wait-on http://localhost:8000/health http://localhost:3000 -t 60000
        
    - name: Run E2E Tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://shop_user:shop_password@localhost:5432/shopsphere
      run: pytest tests/e2e -v --tracing=retain-on-failure

    - name: Upload Playwright Traces
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: backend/test-results/
        retention-days: 7
